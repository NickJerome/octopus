name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish (for example v0.14.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

# Serialize releases so an older job cannot overwrite the latest image.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        id: version
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            const version = process.env.RELEASE_VERSION;
            const stable = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
            if (!stable.test(version)) throw new Error('Use a stable vMAJOR.MINOR.PATCH tag');
            let latest;
            try {
              latest = (await github.rest.repos.getLatestRelease(context.repo)).data.tag_name;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (latest && stable.test(latest)) {
              const a = version.slice(1).split('.').map(BigInt);
              const b = latest.slice(1).split('.').map(BigInt);
              const diff = a.map((n, i) => n > b[i] ? 1 : n < b[i] ? -1 : 0).find(n => n !== 0) ?? 0;
              if (diff <= 0) throw new Error('Release version must be newer than ' + latest);
            }
            let existing;
            try {
              existing = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag: version })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing && !existing.draft) throw new Error('Published releases must not be overwritten');
            core.setOutput('version', version);
            core.setOutput('image', 'ghcr.io/' + (context.repo.owner + '/' + context.repo.repo).toLowerCase());

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.version }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.10.0'
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Update price
        run: python3 scripts/updatePrice.py

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Build release archives
        run: bash scripts/build.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          UPDATE_REPOSITORY: ${{ github.repository }}

      # A draft is not offered to installations until every artifact is ready.
      - name: Upload draft release
        uses: softprops/action-gh-release@v3
        with:
          files: build/archives/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
          make_latest: 'false'
          generate_release_notes: true
          tag_name: ${{ steps.version.outputs.version }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/dockerfile/Dockerfile
          push: true
          platforms: linux/amd64,linux/i386,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: gh release edit "$RELEASE_VERSION" --draft=false --latest
